<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三页进入首页</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1242px; height: 1656px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f0e8; color: #151515; }
    .card { width: 100%; height: 100%; padding: 82px; display: grid; grid-template-rows: auto 1fr auto; container-type: inline-size; }
    header { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 760; color: #65665f; }
    .content { align-self: center; display: grid; gap: 54px; }
    .kicker { color: #3154ff; font-size: 31px; font-weight: 820; letter-spacing: .06em; }
    h1 { margin: 0; font-size: 86px; line-height: 1.12; letter-spacing: -.045em; font-weight: 920; max-width: 980px; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .step { min-height: 310px; padding: 26px; border: 3px solid #151515; border-radius: 36px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 9px 9px 0 #151515; }
    .step:nth-child(2) { transform: translateY(22px); background: #dfe4ff; }
    .step:nth-child(3) { transform: translateY(44px); background: #fff49a; }
    .step small { font-size: 25px; font-weight: 760; color: #6c6d67; }
    .step strong { font-size: 41px; line-height: 1.15; }
    .result { margin-top: 38px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .result div { border-radius: 999px; background: #151515; color: #f3f0e8; padding: 21px 28px; text-align: center; font-size: 30px; font-weight: 800; }
    footer { display: flex; justify-content: space-between; align-items: end; gap: 30px; }
    footer p { margin: 0; font-size: 29px; line-height: 1.45; color: #595b55; max-width: 750px; }
    .brand { font-size: 30px; font-weight: 900; }
  </style>
</head>
<body>
  <article class="card">
    <header><div>我让 AI 按全新用户路径走了一遍</div><div>03 / 06</div></header>
    <div class="content">
      <div class="kicker">首次打开 · 全新浏览器</div>
      <h1>3 页完成设置<br>就能看到首页</h1>
      <div class="steps">
        <div class="step"><small>01</small><strong>界面<br>语言</strong></div>
        <div class="step"><small>02</small><strong>学习<br>语言</strong></div>
        <div class="step"><small>03</small><strong>当前<br>难度</strong></div>
      </div>
      <div class="result"><div>没有注册</div><div>没有碰支付</div></div>
    </div>
    <footer><p>这一步很轻。真正的门槛，在下一张。</p><div class="brand">语见</div></footer>
  </article>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>谁适合谁不适合</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1242px; height: 1656px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f0e8; color: #151515; }
    .card { width: 100%; height: 100%; padding: 78px 82px 70px; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 760; color: #5f605a; }
    .content { align-self: center; display: grid; gap: 40px; }
    h1 { margin: 0; font-size: 88px; line-height: 1.06; letter-spacing: -.045em; font-weight: 930; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .panel { min-height: 610px; border: 3px solid #151515; border-radius: 40px; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; }
    .panel.good { background: #3154ff; color: white; }
    .panel.nope { background: white; }
    .panel h2 { margin: 0; font-size: 45px; }
    .symbol { font-size: 120px; line-height: 1; font-weight: 900; }
    .panel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 24px; }
    .panel li { padding-top: 22px; border-top: 2px solid currentColor; font-size: 31px; line-height: 1.35; font-weight: 720; }
    footer { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: center; border-top: 3px solid #151515; padding-top: 24px; }
    footer strong { font-size: 37px; line-height: 1.3; }
    footer span { background: #fff49a; border: 2px solid #151515; border-radius: 999px; padding: 16px 22px; font-size: 25px; font-weight: 800; }
  </style>
</head>
<body>
  <article class="card">
    <header><div>把不适合的人也写清楚</div><div>06 / 06</div></header>
    <div class="content">
      <h1>它现在适合谁？</h1>
      <div class="split">
        <section class="panel good">
          <div><div class="symbol">✓</div><h2>可以试</h2></div>
          <ul>
            <li>能自己装本地工具</li>
            <li>已有或愿意配置模型密钥</li>
            <li>想自己掌握模型与学习记录</li>
          </ul>
        </section>
        <section class="panel nope">
          <div><div class="symbol">×</div><h2>先别试</h2></div>
          <ul>
            <li>只想手机点开就聊</li>
            <li>不想碰任何配置</li>
            <li>需要真人课程和效果保证</li>
          </ul>
        </section>
      </div>
    </div>
    <footer><strong>你更怕哪一关：<br>订阅说不清，还是自己配密钥？</strong><span>告诉我下一步先改哪关</span></footer>
  </article>
</body>
</html>

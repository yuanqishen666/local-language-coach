<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>低星评价中的计费问题</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1242px; height: 1656px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: #151515; color: #f4f0e8; }
    .card { width: 100%; height: 100%; padding: 78px 82px 66px; display: grid; grid-template-rows: auto 1fr auto; position: relative; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 760; color: #aeb6ff; }
    .content { align-self: center; display: grid; gap: 54px; }
    h1 { margin: 0; font-size: 74px; line-height: 1.18; letter-spacing: -.035em; font-weight: 900; max-width: 900px; }
    .numbers { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: end; }
    .metric { border-top: 4px solid #f4f0e8; padding-top: 26px; }
    .metric strong { display: block; font-size: 190px; line-height: .9; letter-spacing: -.07em; }
    .metric:first-child strong { color: #aeb6ff; }
    .metric:last-child strong { color: #fff49a; }
    .metric span { display: block; margin-top: 24px; font-size: 32px; line-height: 1.35; font-weight: 720; }
    .keywords { display: flex; flex-wrap: wrap; gap: 14px; }
    .keywords span { border: 2px solid #575757; border-radius: 999px; padding: 16px 24px; font-size: 29px; font-weight: 680; }
    footer { display: flex; justify-content: space-between; gap: 34px; border-top: 1px solid #4d4d4d; padding-top: 24px; color: #a9a9a9; font-size: 23px; line-height: 1.45; }
    footer b { color: #f4f0e8; }
  </style>
</head>
<body>
  <article class="card">
    <header><div>先看读者在怕什么</div><div>02 / 06</div></header>
    <div class="content">
      <h1>我先读了同类 / 相邻产品的低星评价</h1>
      <div class="numbers">
        <div class="metric"><strong>93</strong><span>条三星及以下评价</span></div>
        <div class="metric"><strong>29</strong><span>条提到计费问题</span></div>
      </div>
      <div class="keywords" aria-label="计费关键词">
        <span>扣费</span><span>续费</span><span>订阅</span><span>退款</span>
      </div>
    </div>
    <footer>
      <div><b>3 款英语学习 App</b><br>公开 App Store 评价</div>
      <div>统计于 2026-11-26<br>只说明这批材料，不外推行业比例</div>
    </footer>
  </article>
</body>
</html>

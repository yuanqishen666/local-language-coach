<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI英语陪练先看清三笔账</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1242px; height: 1656px; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f0e8; color: #151515; }
    .card { width: 100%; height: 100%; padding: 84px 82px 72px; display: grid; grid-template-rows: auto 1fr auto; container-type: inline-size; position: relative; isolation: isolate; }
    .card::before { content: ""; position: absolute; width: 690px; height: 690px; border-radius: 50%; background: #3154ff; right: -215px; top: -310px; z-index: -1; }
    .card::after { content: ""; position: absolute; inset: 0; opacity: .16; z-index: -1; background-image: radial-gradient(#151515 0.7px, transparent 0.7px); background-size: 12px 12px; mask-image: linear-gradient(to bottom, #000, transparent 62%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
    .brand { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 850; letter-spacing: .02em; }
    .face { width: 58px; aspect-ratio: 1; border-radius: 50%; background: #151515; position: relative; }
    .face::before { content: "••"; position: absolute; left: 13px; top: 5px; color: white; letter-spacing: 8px; font-size: 19px; }
    .index { font-size: 28px; font-weight: 700; color: #f3f0e8; }
    .content { align-self: center; display: grid; gap: 42px; max-width: 1050px; }
    .eyebrow { display: inline-flex; width: max-content; align-items: center; gap: 14px; border: 3px solid #151515; border-radius: 999px; padding: 16px 26px; font-size: 30px; font-weight: 780; background: rgba(243,240,232,.9); }
    .dot { width: 16px; height: 16px; border-radius: 50%; background: #3154ff; }
    h1 { margin: 0; font-size: 126px; line-height: .98; letter-spacing: -.055em; font-weight: 950; }
    h1 span { color: #3154ff; }
    .ledger { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
    .ledger span { border-top: 3px solid #151515; padding: 20px 4px 0; font-size: 34px; font-weight: 760; }
    footer { display: flex; align-items: end; justify-content: space-between; gap: 28px; }
    footer p { margin: 0; font-size: 29px; line-height: 1.45; color: #5e605b; font-weight: 650; }
    .stamp { background: #151515; color: #f3f0e8; border-radius: 999px; padding: 18px 26px; font-size: 26px; font-weight: 800; transform: rotate(-2deg); }
  </style>
</head>
<body>
  <article class="card">
    <header>
      <div class="brand"><span class="face" aria-hidden="true"></span><span>语见 · 首次路径实测</span></div>
      <div class="index">01 / 06</div>
    </header>
    <div class="content">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span>AI 英语陪练</div>
      <h1>先看清<br>这 <span>3 笔账</span></h1>
      <div class="ledger" aria-label="订阅、模型、时间">
        <span>01 订阅</span>
        <span>02 模型</span>
        <span>03 时间</span>
      </div>
    </div>
    <footer>
      <p>“不收会员费”<br>也不等于零成本</p>
      <div class="stamp">真实门槛摊开讲</div>
    </footer>
  </article>
</body>
</html>

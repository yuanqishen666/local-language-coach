# An example of serving the web version (what `npm run web:build` writes to dist/site) with Nginx.
# The name, the folder and the certificate are yours to fill in.
server {
  listen 443 ssl;
  server_name coach.example.com;
  ssl_certificate /etc/ssl/coach.example.com/fullchain.pem;
  ssl_certificate_key /etc/ssl/coach.example.com/privkey.pem;
  root /srv/language-coach;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  # The app keeps its data in the visitor's browser and sends none of it here, so there is nothing to record
  # but who came, and that is not recorded either.
  access_log off;

  # Browsers compile the database engine as it arrives only when it is sent as what it is.
  include mime.types;
  types { application/wasm wasm; }

  # The same policy the page declares for itself, sent with the background thread's script as well.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Files under /assets are named after their contents, so one name never means anything else. Leave the files
  # of the version before in place when putting a new one up: pages still open go on asking for them.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location ~ ^/privacy/?$ { expires -1; try_files /privacy/index.html =404; }
  location ~ ^/(?<language>zh|en|es|fr|ja|de|ko|it|pt|hi)(?<public_page>/privacy)?/?$ {
    expires -1;
    try_files /$language$public_page/index.html =404;
  }

  # Other app routes use the generic entry and keep current language in the tab.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
